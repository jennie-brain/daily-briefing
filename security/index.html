<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>정보보안 뉴스 브리핑</title>
<style>
  :root{
    --bg:#f7f7f8;
    --card:#ffffff;
    --border:#e5e5ea;
    --text:#1c1c1e;
    --sub:#6b6b70;
    --accent:#2f5bea;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;
    flex-direction:column;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .header-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 16px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .title-group{display:flex;align-items:center;gap:8px;min-width:0;}
  .title-group .emoji{font-size:19px;}
  .title-group .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .date-picker{display:flex;align-items:center;gap:8px;}
  .date-picker .current{font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap;}
  input[type=date]{
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
  }
  .frame-wrap{flex:1;min-height:0;}
  iframe{width:100%;height:100%;border:none;display:block;background:var(--bg);}
  .empty{padding:40px 16px;text-align:center;color:var(--sub);font-size:14px;}
</style>
</head>
<body>
  <div class="header-bar">
    <div class="title-group">
      <span class="emoji">🔐</span>
      <span class="name">정보보안 뉴스 브리핑</span>
    </div>
    <div class="date-picker">
      <span class="current" id="currentLabel">2026.08.08</span>
      <input type="date" id="datePicker" min="2026-07-23" max="2026-08-08" value="2026-08-08" aria-label="날짜 선택">
    </div>
  </div>
  <div class="frame-wrap">
    <iframe id="briefingFrame" title="정보보안 뉴스 브리핑"></iframe>
  </div>
  <script>
    const AVAILABLE = ["2026-08-08", "2026-08-07", "2026-08-04", "2026-08-03", "2026-07-31", "2026-07-30", "2026-07-29", "2026-07-28", "2026-07-27", "2026-07-26", "2026-07-25", "2026-07-24", "2026-07-23"];
    const input = document.getElementById('datePicker');
    const frame = document.getElementById('briefingFrame');
    const label = document.getElementById('currentLabel');

    function nearestAvailable(target) {
      for (const d of AVAILABLE) { if (d <= target) return d; }
      return AVAILABLE[AVAILABLE.length - 1];
    }

    function loadDate(d) {
      if (!d || !frame) return;
      frame.src = './' + d + '.html';
      input.value = d;
      label.textContent = d.replaceAll('-', '.');
    }

    if (AVAILABLE.length) {
      input.addEventListener('change', () => {
        const picked = input.value;
        const match = AVAILABLE.includes(picked) ? picked : nearestAvailable(picked);
        loadDate(match);
      });
      loadDate(AVAILABLE[0]);
    }
  </script>
</body>
</html>
