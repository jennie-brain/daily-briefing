<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>뉴스 브리핑</title>
<style>
  :root{
    --bg:#f7f7f8;
    --card:#ffffff;
    --border:#e5e5ea;
    --text:#1c1c1e;
    --sub:#6b6b70;
    --accent:#2f5bea;
    --accent-bg:#eef1fd;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
  .page-title{font-size:20px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--sub);font-size:13px;margin:0 0 20px;}
  a{color:inherit;text-decoration:none;}
  .topic-card{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .topic-card .emoji{font-size:26px;}
  .topic-card .name{font-weight:700;font-size:17px;margin:8px 0 4px;}
  .topic-card .sub{margin:0;}
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">📰 뉴스 브리핑</h1>
    <p class="sub">주제별 일일 뉴스 브리핑 모음</p>
      <a class="topic-card" href="./fintech/index.html">
        <div class="emoji">💳</div>
        <div class="name">핀테크·토큰증권 뉴스 브리핑</div>
        <div class="sub">최신: 2026.08.08</div>
      </a>
      <a class="topic-card" href="./security/index.html">
        <div class="emoji">🔐</div>
        <div class="name">정보보안 뉴스 브리핑</div>
        <div class="sub">최신: 2026.08.08</div>
      </a>
  </div>
</body>
</html>
